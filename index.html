<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#181131">
<title>Session Runner 3D — Powder Expedition 🏂</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<div id="hud">
  <div id="score">0</div><div id="best">BEST 0</div><div id="combo">FLOW ×1</div><div id="trick" aria-live="polite"></div>
  <div id="zone">✦ TWILIGHT PINES</div><div id="meta">EXPEDITION I · RUN 1</div>
  <div id="speedwrap"><div id="speedbar"></div></div>
  <div id="announce"></div>
  <div id="storycard"><div id="storycard-eyebrow"></div><div id="storycard-line"></div></div>
  <div id="overlay"><div id="eyebrow"></div><div id="title"></div><div id="sub"></div><div id="cta"></div><div id="runStats"></div><div id="epilogue"></div></div>
  <div id="hint"><b>← →</b> or <b>A/D</b> carve / spin &nbsp;·&nbsp; <b>↑ / W</b> jump &nbsp;·&nbsp; collect <b>✦ SHARDS</b> for flow &nbsp;·&nbsp; touch: drag</div>
</div>
<script>
window.GameEvents = { _l:{}, on(ev,fn){ (this._l[ev]=this._l[ev]||[]).push(fn); }, emit(ev,data){ (this._l[ev]||[]).forEach(f=>f(data)); } };
window.Game = window.Game || {};
</script>
<script type="module" src="js/world.js"></script>
<script type="module" src="js/rider.js"></script>
<script type="module" src="js/audio.js"></script>
<script type="module" src="js/ui.js"></script>
<script type="module" src="js/story.js"></script>
<script type="module" src="js/core.js"></script>
<script type="module" src="js/vfx.js"></script>
</body>
</html>
