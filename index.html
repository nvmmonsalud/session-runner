<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Session Runner 🏄</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a1628;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  canvas {
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    max-width: 96vw;
    max-height: 82vh;
    background: linear-gradient(#0e2a4a, #123f66);
  }
  #hint {
    color: #5b7ea6;
    font-size: 13px;
    letter-spacing: .04em;
    text-align: center;
    padding: 0 16px;
  }
  #hint b { color: #8fc3ee; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hint"><b>← →</b> or <b>A/D</b> to carve &nbsp;·&nbsp; <b>Space</b> to start / restart &nbsp;·&nbsp; touch: drag</div>
</div>
<script>
(function(){
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- State machine ----------
const STATE = { MENU: 0, PLAYING: 1, GAME_OVER: 2 };
let state = STATE.MENU;
let hiScore = 0;
try { hiScore = parseInt(localStorage.getItem('sessionRunnerHi') || '0', 10) || 0; } catch(e) {}

// ---------- Input ----------
const keys = {};
let touchX = null;
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ([' ','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if (e.key === ' ') {
    if (state === STATE.MENU || state === STATE.GAME_OVER) startGame();
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state !== STATE.PLAYING) { startGame(); return; }
  touchX = e.touches[0].clientX;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  touchX = e.touches[0].clientX;
}, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); touchX = null; }, { passive: false });
canvas.addEventListener('mousedown', () => {
  if (state !== STATE.PLAYING) startGame();
});

// ---------- Audio (procedural, gesture-gated) ----------
let actx = null;
function initAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function blip(freq, dur, type, vol) {
  if (!actx) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.12, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (dur || 0.1));
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + (dur || 0.1));
}
function crash() {
  if (!actx) return;
  const len = actx.sampleRate * 0.35;
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource();
  const g = actx.createGain();
  g.gain.setValueAtTime(0.25, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.35);
  src.buffer = buf;
  src.connect(g); g.connect(actx.destination);
  src.start();
}

// ---------- Game objects ----------
const player = { x: W / 2, y: H - 110, w: 26, h: 40, vx: 0 };
let obstacles = [];   // rocks
let crests = [];      // bonus wave crests
let particles = [];
let score = 0;
let speed = 4;
let dist = 0;
let shake = 0;
let frame = 0;

function startGame() {
  initAudio();
  state = STATE.PLAYING;
  obstacles = [];
  crests = [];
  particles = [];
  score = 0;
  speed = 4;
  dist = 0;
  shake = 0;
  player.x = W / 2;
  player.vx = 0;
  blip(440, 0.15, 'triangle', 0.15);
  setTimeout(() => blip(660, 0.2, 'triangle', 0.15), 120);
}

function spawnObstacle() {
  const r = 14 + Math.random() * 26;
  obstacles.push({ x: r + Math.random() * (W - r * 2), y: -r * 2, r: r });
}
function spawnCrest() {
  crests.push({ x: 30 + Math.random() * (W - 60), y: -20, r: 12 });
}
function spawnSpray(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 5,
      vy: -Math.random() * 4 - 1,
      life: 30 + Math.random() * 20,
      color: color || 'rgba(180,220,255,'
    });
  }
}

// ---------- Update ----------
function update(dt) {
  if (state !== STATE.PLAYING) return;
  frame++;

  // ramp difficulty
  dist += speed * dt;
  score = Math.floor(dist / 10);
  speed = Math.min(4 + dist / 1200, 11);

  // player movement
  const accel = 0.9;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.vx -= accel;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) player.vx += accel;
  if (touchX !== null) {
    const rect = canvas.getBoundingClientRect();
    const tx = (touchX - rect.left) * (W / rect.width);
    player.vx += (tx - player.x) * 0.04;
  }
  player.vx *= 0.86; // friction
  player.x += player.vx * dt;
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

  // spray trail
  if (frame % 3 === 0) spawnSpray(player.x, player.y + player.h / 2, 2);

  // spawns
  const rockGap = Math.max(34 - Math.floor(dist / 600), 14);
  if (frame % rockGap === 0) spawnObstacle();
  if (frame % 180 === 0) spawnCrest();

  // move + cull obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].y += speed * dt;
    if (obstacles[i].y > H + 60) obstacles.splice(i, 1);
  }
  for (let i = crests.length - 1; i >= 0; i--) {
    crests[i].y += speed * dt;
    if (crests[i].y > H + 30) crests.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.15 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // collisions: rocks
  for (const o of obstacles) {
    const dx = o.x - player.x, dy = o.y - player.y;
    if (Math.abs(dx) < o.r + player.w / 2 - 4 && Math.abs(dy) < o.r + player.h / 2 - 4) {
      state = STATE.GAME_OVER;
      crash();
      shake = 18;
      spawnSpray(player.x, player.y, 40, 'rgba(255,255,255,');
      if (score > hiScore) {
        hiScore = score;
        try { localStorage.setItem('sessionRunnerHi', String(hiScore)); } catch(e) {}
      }
      return;
    }
  }
  // collisions: crests (bonus)
  for (let i = crests.length - 1; i >= 0; i--) {
    const c = crests[i];
    const dx = c.x - player.x, dy = c.y - player.y;
    if (Math.hypot(dx, dy) < c.r + 22) {
      crests.splice(i, 1);
      dist += 150; // +15 points
      blip(880, 0.12, 'sine', 0.18);
      setTimeout(() => blip(1320, 0.15, 'sine', 0.14), 60);
      spawnSpray(c.x, c.y, 16, 'rgba(120,255,220,');
    }
  }

  if (shake > 0) shake -= dt;
}

// ---------- Render ----------
function drawBackground() {
  // water stripes scrolling
  ctx.fillStyle = '#10355c';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(70,140,200,0.16)';
  const off = (dist * 0.6) % 80;
  for (let y = -80 + off; y < H + 80; y += 80) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 20) {
      const yy = y + Math.sin((x + frame * 2) * 0.02) * 8;
      x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(90,170,230,0.22)';
    ctx.stroke();
  }
}

function render() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawBackground();

  // particles
  for (const p of particles) {
    ctx.fillStyle = p.color + Math.max(p.life / 50, 0) + ')';
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }

  // crests (glowing teal circles)
  for (const c of crests) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r + Math.sin(frame * 0.15) * 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(90,255,210,0.9)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r + 6, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(90,255,210,0.35)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // rocks
  for (const o of obstacles) {
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fillStyle = '#3d3d4d';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(o.x - o.r * 0.3, o.y - o.r * 0.3, o.r * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = '#55556a';
    ctx.fill();
  }

  // player: board + surfer
  if (state !== STATE.GAME_OVER) {
    const tilt = player.vx * 0.06;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(tilt);
    // board
    ctx.beginPath();
    ctx.ellipse(0, 6, 9, 26, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ffb347';
    ctx.fill();
    ctx.strokeStyle = '#e08a1e';
    ctx.lineWidth = 2;
    ctx.stroke();
    // surfer body
    ctx.beginPath();
    ctx.arc(0, -8, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#ff6b6b';
    ctx.fill();
    ctx.restore();
  }

  // HUD
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.font = 'bold 26px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(String(score), 18, 38);
  ctx.font = '13px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('BEST ' + hiScore, 18, 58);

  // speed meter
  const pct = (speed - 4) / 7;
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(W - 118, 24, 100, 8);
  ctx.fillStyle = pct > 0.7 ? '#ff6b6b' : '#8fc3ee';
  ctx.fillRect(W - 118, 24, 100 * pct, 8);

  ctx.restore();

  // overlays
  if (state === STATE.MENU) {
    overlay('SESSION RUNNER', '🏄 dodge the rocks · snag the crests', 'SPACE / TAP to drop in');
  } else if (state === STATE.GAME_OVER) {
    overlay('WIPEOUT!', 'score ' + score + (score >= hiScore && score > 0 ? ' — NEW BEST! 🌊' : ' · best ' + hiScore), 'SPACE / TAP to paddle back out');
  }
}

function overlay(title, sub, cta) {
  ctx.fillStyle = 'rgba(6,18,36,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 40px -apple-system, sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 50);
  ctx.fillStyle = '#8fc3ee';
  ctx.font = '16px -apple-system, sans-serif';
  ctx.fillText(sub, W / 2, H / 2 - 12);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + Math.sin(Date.now() * 0.005) * 0.35) + ')';
  ctx.font = 'bold 18px -apple-system, sans-serif';
  ctx.fillText(cta, W / 2, H / 2 + 40);
}

// ---------- Loop (dt-capped) ----------
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 16.667; // normalized to 60fps units
  last = now;
  if (dt > 3) dt = 3; // cap so tab-switch doesn't teleport
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
